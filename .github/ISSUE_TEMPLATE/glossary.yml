name: 建議漫才譯名
description: 補充藝人、組合、節目或術語，或修正現有翻譯。
title: '[詞庫] '
body:
  - type: input
    id: japanese
    attributes: {label: 日文原名／別名}
    validations: {required: true}
  - type: input
    id: chinese
    attributes: {label: 建議的繁中譯名}
    validations: {required: true}
  - type: textarea
    id: reason
    attributes: {label: 原因與參考來源, description: 可貼節目或藝人的公開資料連結。請勿貼 API Key 或私人資料。}
    validations: {required: true}
